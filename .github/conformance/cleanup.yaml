# Provider-local live smoke fixture. The live workflow applies this file to
# create one tagged Droplet, then passes the same file to `wfctl infra cleanup`
# so the external DigitalOcean plugin owns both mutation and recovery.
infra:
  auto_bootstrap: false

modules:
  - name: do-provider
    type: iac.provider
    config:
      provider: digitalocean
      token: ${DIGITALOCEAN_TOKEN}

  - name: conformance-smoke-droplet
    type: infra.droplet
    config:
      provider: do-provider
      name: ${CONFORMANCE_RESOURCE_NAME}
      region: nyc1
      size: s-1vcpu-512mb-10gb
      image: ubuntu-24-04-x64
      monitoring: false
      tags:
        - ${CONFORMANCE_TAG}
