name: DigitalOcean Conformance Leak Scrubber

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: digitalocean-conformance-leak-scrubber
  cancel-in-progress: false

jobs:
  scrub:
    name: Delete expired conformance Droplets
    runs-on: [self-hosted, linux]
    env:
      DO_CONFORMANCE_API_TOKEN: ${{ secrets.DO_CONFORMANCE_API_TOKEN }}
      AGE_THRESHOLD_SECONDS: 3600
      CONFORMANCE_TAG_PREFIX: wf-do-conformance-
      BUDGET_HARD_CAP_USD: 25
    steps:
      - name: Check out provider plugin
        uses: actions/checkout@v4
      - name: Fail when the scrubber token is missing
        run: |
          set -euo pipefail
          test -n "${DO_CONFORMANCE_API_TOKEN:-}" || {
            echo "::error::DO_CONFORMANCE_API_TOKEN is required for scheduled cleanup"
            exit 1
          }
      - name: List and delete expired tagged Droplets
        id: scrub
        run: |
          set -euo pipefail
          scrubbed=0
          failure_count=0
          details=""

          record_failure() {
            failure_count="$((failure_count + 1))"
            details="${details}- FAILURE: $1"$'\n'
            echo "::error::$1"
          }

          publish_outputs() {
            set +e
            delimiter="WF_DO_${RANDOM}_${RANDOM}_$$"
            while grep -Fqx -- "${delimiter}" <<< "${details}"; do
              delimiter="WF_DO_${RANDOM}_${RANDOM}_$$"
            done
            {
              echo "count=${scrubbed}"
              echo "failures=${failure_count}"
              echo "details<<${delimiter}"
              printf '%s' "${details}"
              echo "${delimiter}"
            } >> "${GITHUB_OUTPUT}"
            {
              echo "scrubbed_count=${scrubbed}"
              echo "cleanup_failures=${failure_count}"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          trap 'publish_outputs' EXIT
          now_epoch="$(date -u +%s)"
          page_url="https://api.digitalocean.com/v2/droplets?per_page=200"
          seen_pages="$(mktemp "${RUNNER_TEMP}/do-conformance-pages.XXXXXX")"
          trap 'rm -f "${seen_pages}"; publish_outputs' EXIT

          while [ -n "${page_url}" ]; do
            if ! page_error="$(.github/workflows/scripts/conformance-safety.sh \
              validate-do-page-url "${page_url}" "${seen_pages}" 2>&1)"; then
              record_failure "pagination URL rejected: ${page_error}"
              break
            fi
            list_body="$(mktemp "${RUNNER_TEMP}/do-conformance-list.XXXXXX")"
            set +e
            list_status="$(curl --disable --silent --show-error --fail --proto '=https' --max-redirs 0 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${DO_CONFORMANCE_API_TOKEN}" \
              --output "${list_body}" \
              --write-out '%{http_code}' \
              "${page_url}")"
            list_curl_status=$?
            set -e
            if [[ "${list_curl_status}" -ne 0 ]]; then
              record_failure "failed to list Droplets from a validated DigitalOcean page (HTTP ${list_status:-unknown})"
              rm -f "${list_body}"
              break
            fi
            if ! .github/workflows/scripts/conformance-safety.sh \
              validate-do-list-response "${list_status}" "${list_body}"; then
              record_failure "DigitalOcean Droplet list returned unusable HTTP ${list_status} response"
              rm -f "${list_body}"
              break
            fi
            response="$(<"${list_body}")"
            rm -f "${list_body}"
            if ! rows="$(jq -r --arg prefix "${CONFORMANCE_TAG_PREFIX}" \
              '.droplets[]? | select(.tags // [] | any(startswith($prefix))) | [.id, .name, .created_at] | @tsv' \
              <<< "${response}")"; then
              record_failure "failed to parse DigitalOcean Droplet page"
              break
            fi
            while IFS=$'\t' read -r id name created_at; do
              [ -n "${id}" ] || continue
              if [[ ! "${id}" =~ ^[0-9]+$ ]]; then
                record_failure "invalid Droplet ID in list response"
                continue
              fi
              if ! created_epoch="$(date -u -d "${created_at}" +%s 2>/dev/null)"; then
                record_failure "invalid created_at for Droplet ${id}"
                continue
              fi
              age="$((now_epoch - created_epoch))"
              if [ "${age}" -gt "${AGE_THRESHOLD_SECONDS}" ]; then
                delete_body="$(mktemp "${RUNNER_TEMP}/do-conformance-delete.XXXXXX")"
                set +e
                delete_status="$(curl --disable --silent --show-error --fail --proto '=https' --max-redirs 0 --connect-timeout 10 --max-time 30 \
                  -X DELETE \
                  -H "Authorization: Bearer ${DO_CONFORMANCE_API_TOKEN}" \
                  --output "${delete_body}" \
                  --write-out '%{http_code}' \
                  "https://api.digitalocean.com/v2/droplets/${id}")"
                delete_curl_status=$?
                set -e
                rm -f "${delete_body}"
                if [[ "${delete_curl_status}" -ne 0 ]]; then
                  record_failure "Droplet ${id} DELETE request failed (HTTP ${delete_status:-unknown})"
                  continue
                fi
                if ! .github/workflows/scripts/conformance-safety.sh validate-do-delete-status "${delete_status}"; then
                  record_failure "Droplet ${id} DELETE returned unexpected HTTP ${delete_status}"
                  continue
                fi
                scrubbed="$((scrubbed + 1))"
                details="${details}- droplet ${id} (${name}, age=${age}s)"$'\n'
              fi
            done <<< "${rows}"
            if ! next_page="$(jq -r '.links.pages.next // "" | if type == "string" then . else error("next page must be a string") end' <<< "${response}")"; then
              record_failure "failed to parse DigitalOcean next-page URL"
              break
            fi
            page_url="${next_page}"
          done

      - name: File or update the cleanup incident
        if: >-
          always() && !cancelled()
          && (steps.scrub.outcome == 'failure'
              || steps.scrub.outputs.count != '0'
              || steps.scrub.outputs.failures != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          SCRUB_COUNT: ${{ steps.scrub.outputs.count || '0' }}
          SCRUB_FAILURES: ${{ steps.scrub.outputs.failures || 'unknown' }}
          SCRUB_DETAILS: ${{ steps.scrub.outputs.details }}
        run: |
          ISSUE_TITLE="DigitalOcean conformance cleanup: ${SCRUB_COUNT} deleted, ${SCRUB_FAILURES} failures" \
          .github/workflows/scripts/file-or-comment-leak-issue.sh \
            "${SCRUB_COUNT}" "${SCRUB_DETAILS}"
      - name: Escalate spend at or above the hard cap
        if: always() && !cancelled() && steps.scrub.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          balance="$(curl --disable --silent --show-error --fail --proto '=https' --max-redirs 0 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${DO_CONFORMANCE_API_TOKEN}" \
            https://api.digitalocean.com/v2/customers/my/balance)"
          spend="$(jq -er '.month_to_date_usage // "0" | tonumber' <<< "${balance}")"
          budget_state="$(.github/workflows/scripts/conformance-safety.sh budget-state "${spend}" "${BUDGET_HARD_CAP_USD}")"
          if [[ "${budget_state}" == "at-or-over" ]]; then
            PRIMARY_LABEL=conformance-budget-incident \
            HELPER_LABEL=auto-filed-budget \
            ISSUE_TITLE="DigitalOcean conformance budget incident" \
              .github/workflows/scripts/file-or-comment-leak-issue.sh \
                "${spend}" "Month-to-date usage remains at or above the hard cap"
          fi
      - name: Fail after incomplete cleanup reporting
        if: >-
          always() && !cancelled()
          && (steps.scrub.outcome == 'failure'
              || steps.scrub.outputs.failures != '0')
        run: |
          echo "::error::DigitalOcean cleanup was incomplete after incident and budget reporting"
          exit 1
