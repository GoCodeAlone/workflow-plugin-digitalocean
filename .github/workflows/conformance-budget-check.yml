name: DigitalOcean Conformance Budget Check

on:
  workflow_call:
    secrets:
      DO_CONFORMANCE_API_TOKEN:
        description: Dedicated conformance-account DigitalOcean API token
        required: true

permissions:
  contents: read
  issues: write

jobs:
  check-budget:
    name: Abort live work over budget
    runs-on: [self-hosted, linux]
    env:
      DO_CONFORMANCE_API_TOKEN: ${{ secrets.DO_CONFORMANCE_API_TOKEN }}
      BUDGET_SOFT_CAP_USD: 15
      BUDGET_HARD_CAP_USD: 25
    steps:
      - name: Check out provider plugin
        uses: actions/checkout@v4
      - name: Fail before mutation when the token is missing
        run: |
          set -euo pipefail
          test -n "${DO_CONFORMANCE_API_TOKEN:-}" || {
            echo "::error::DO_CONFORMANCE_API_TOKEN is required for the budget gate"
            exit 1
          }
      - name: Fetch month-to-date usage
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ${DO_CONFORMANCE_API_TOKEN}" \
            https://api.digitalocean.com/v2/customers/my/balance \
            > "${RUNNER_TEMP}/do-conformance-balance.json"
      - name: Enforce budget caps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SPEND="$(jq -er '.month_to_date_usage // "0" | tonumber' "${RUNNER_TEMP}/do-conformance-balance.json")"
          echo "month_to_date_usage=${SPEND}" >> "${GITHUB_STEP_SUMMARY}"
          if awk "BEGIN { exit !(${SPEND} > ${BUDGET_HARD_CAP_USD}) }"; then
            echo "::error title=Budget exceeded::DigitalOcean conformance month-to-date \$${SPEND} exceeds the \$${BUDGET_HARD_CAP_USD} cap"
            exit 1
          fi
          if awk "BEGIN { exit !(${SPEND} > ${BUDGET_SOFT_CAP_USD}) }"; then
            echo "::warning title=Budget approaching cap::DigitalOcean conformance month-to-date \$${SPEND} exceeds \$${BUDGET_SOFT_CAP_USD}"
            PRIMARY_LABEL=conformance-budget-incident \
            HELPER_LABEL=auto-filed-budget \
            ISSUE_TITLE="DigitalOcean conformance budget soft alert" \
              .github/workflows/scripts/file-or-comment-leak-issue.sh \
                "${SPEND}" "Month-to-date usage exceeds the soft cap"
          fi
