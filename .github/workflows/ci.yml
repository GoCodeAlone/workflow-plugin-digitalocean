            GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH}" \
            GITHUB_REF="${GITHUB_REF}" \
            GITHUB_SHA="${GITHUB_SHA}" \
            GITHUB_WORKFLOW_REF="${GITHUB_WORKFLOW_REF}" \
            GITHUB_WORKFLOW_SHA="${GITHUB_WORKFLOW_SHA}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY}" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            PROVIDER_BOOTSTRAP_PREPARATION_SHA="${PROVIDER_BOOTSTRAP_PREPARATION_SHA}" \
            /opt/hostedtoolcache/go/1.27.2/x64/bin/go test -race ./...
      - name: Full root vet under authenticated compiler
        run: |
          set -euo pipefail
          env -i \
            PATH=/opt/hostedtoolcache/go/1.27.2/x64/bin:/usr/bin:/bin \
            HOME=/home/runner \
            LANG=C.UTF-8 \
            GOROOT=/opt/hostedtoolcache/go/1.27.2/x64 \
            GOENV=off \
            GOWORK=off \
            GOTOOLCHAIN=local \
            GOFLAGS=-mod=readonly \
            CGO_ENABLED=1 \
            GOOS=linux \
            GOARCH=amd64 \
            GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org \
            GOPATH=/home/runner/go \
            GOCACHE=/home/runner/.cache/go-build \
            GOMODCACHE=/home/runner/go/pkg/mod \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_NO_REPLACE_OBJECTS=1 \
            GIT_TERMINAL_PROMPT=0 \
            GIT_ASKPASS=/bin/false \
            CI=true \
            GITHUB_ACTIONS="${GITHUB_ACTIONS}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            GITHUB_REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH}" \
            GITHUB_REF="${GITHUB_REF}" \
            GITHUB_SHA="${GITHUB_SHA}" \
            GITHUB_WORKFLOW_REF="${GITHUB_WORKFLOW_REF}" \
            GITHUB_WORKFLOW_SHA="${GITHUB_WORKFLOW_SHA}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            GITHUB_STEP_SUMMARY="${GITHUB_STEP_SUMMARY}" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            PROVIDER_BOOTSTRAP_PREPARATION_SHA="${PROVIDER_BOOTSTRAP_PREPARATION_SHA}" \
            /opt/hostedtoolcache/go/1.27.2/x64/bin/go vet ./...
      - name: Enforce complete public policy fixtures with available rg
        run: |
          set -euo pipefail
          test "$(env -i PATH=/opt/hostedtoolcache/go/1.27.2/x64/bin:/usr/bin:/bin /bin/bash -c 'command -v rg')" = /usr/bin/rg
          printf 'secrets.TEST\n' | /usr/bin/rg -q -P 'secrets\.(?!GITHUB_TOKEN\b)'
          env -i \
            PATH=/opt/hostedtoolcache/go/1.27.2/x64/bin:/usr/bin:/bin \
            HOME=/home/runner \
            LANG=C.UTF-8 \
            GOROOT=/opt/hostedtoolcache/go/1.27.2/x64 \
            GOENV=off \
            GOWORK=off \
            GOTOOLCHAIN=local \
            GOFLAGS=-mod=readonly \
            CGO_ENABLED=1 \
            GOOS=linux \
            GOARCH=amd64 \
            GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org \
            GOPATH=/home/runner/go \
            GOCACHE=/home/runner/.cache/go-build \
            GOMODCACHE=/home/runner/go/pkg/mod \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_NO_REPLACE_OBJECTS=1 \
            GIT_TERMINAL_PROMPT=0 \
