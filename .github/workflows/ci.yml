      - name: Emit complete actual bootstrap receipt
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/provider-policy-bootstrap-receipt.json"
          test -f "$receipt"
          test "$(stat -c %a "$receipt")" = 600
          test "$(stat -c %s "$receipt")" -le 262145
          sha256sum "$receipt"
          cat "$receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-accepted-policy-bootstrap-receipt
          path: ${{ runner.temp }}/provider-policy-bootstrap-receipt.json
